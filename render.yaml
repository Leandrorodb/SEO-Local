services:
  - type: web
    name: seo-local-api
    env: node
    plan: free
    region: ohio
    buildCommand: npm ci --include=dev && npm run typecheck && npm run build:render
    startCommand: node dist/render/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.22.3
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: OWNER_EMAIL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        value: https://seo-local-64b17.web.app
      - key: RANK_PROVIDER
        value: disabled
      - key: RANK_QUEUE_MODE
        value: local_collector
      - key: RANK_GLOBAL_MONTHLY_BUDGET_MICROS
        value: 10000000
