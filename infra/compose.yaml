services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: lrt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database administrator password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lrt"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
